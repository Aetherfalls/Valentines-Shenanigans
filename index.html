<!DOCTYPE html>
<html lang="en">   
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click me fr!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="bg-slate-900 h-screen flex flex-col items-center justify-center text-white overflow-hidden">
    <div class="mb-8">  
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTV0MnZ5MWpqN3l6bzB2bmo4Z2p6Nmt6NG1hNXc0cWx0OG5lbTcybCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Zl7u48zLVFgLpRwq6f/giphy.gif"
             alt="Cute Animation"
             class="w-64 h-64 rounded-2xl shadow-2xl object-cover">
    </div>
    <h1 id="question" class="text-4xl md:text-6xl font-bold text-center mb-8 bg-gradient-to-r from-pink-500 to-rose-400 text-transparent bg-clip-text"> 
        Will you be my Valentine?
    </h1>
    <div class="flex gap-6 relative">   
        <button id="yesButton"
                class="bg-rose-600 hover:bg-rose-700 px-10 py-4 rounded-full font-bold text-xl transition-transform hover:scale-110">
            Yes
        </button>

        <button id="noButton"
                 class="bg-slate-700 px-10 py-4 rounded-full font-bold text-xl absolute left-40">
            No
        </button>     
    </div>
   
    <script src="script.js"></script>
</body>

</html>
